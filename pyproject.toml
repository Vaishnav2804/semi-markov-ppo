[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semi-markov-ppo"
version = "0.1.0"
description = "A PyTorch implementation of Semi-Markov Proximal Policy Optimization (PPO), extending sb3-contrib MaskablePPO (Stable-Baselines3 ecosystem) with variable-duration actions, transition-specific discounting, and variable-duration GAE."
readme = "README.md"
requires-python = ">=3.10"
# license: intentionally not declared until the owner approves it (see docs/licensing.md). Proposed: license = "MIT"
dependencies = [
  "stable-baselines3>=2.7.0,<2.8",
  "sb3-contrib>=2.7.0,<2.8",
  "gymnasium>=1.0",
  "torch>=2.0",
  "numpy>=1.24",
]

[project.optional-dependencies]
examples = ["pandas>=2.0", "matplotlib>=3.7"]
dev = ["pytest>=8", "ruff>=0.6", "pandas>=2.0", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["examples/mountaincar"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# ppo.py is kept byte-identical to the validated research implementation (see docs/design.md), so it is not reformatted.
"src/smppo/ppo.py" = ["E501", "E702"]

[tool.ruff.format]
exclude = ["src/smppo/ppo.py"]
